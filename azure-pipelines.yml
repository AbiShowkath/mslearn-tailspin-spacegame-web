trigger:
- '*'

name: Deploy Bicep files

variables:
  vmImageName: 'ubuntu-latest'

  buildConfiguration: 'Release'
  wwwrootDir: 'Tailspin.SpaceGame.Web/wwwroot'
  dotnetSdkVersion: '8.0.x'

  # Azure Resource Variables
  resourceGroupName: 'SpaceGameResourceGroup'
  location: 'eastus'
  # adminUserName: 'abishowkathazurewebuser'
  # vmName: 'SpaceGameVM'
  # vmImage: 'Ubuntu2204'
  # vmSize: 'Standard_B1s'
  # vmDiskName: 'uploadDataDisk2'
  # vmDiskSize: '8'
  # vmsku: 'Premium_LRS'
  # storagesku: 'Standard_LRS'
  # containerName: 'spacegamecontainer'

  templateFile: 'bicep/main.bicep'
  csmParametersFile: 'bicep/main.bicepparam'
  acrName: 'spacegameacr2024'
  hostname: ''

pool:
  vmImage: $(vmImageName)

parameters:
- name: serviceConnection
  displayName: Azure Service Connection Name
  type: string
  default: azure-subscription-1

steps:
    - task: AzureResourceManagerTemplateDeployment@3
      name: deployBicep
      displayName: 'Deploy Bicep Template'
      inputs:
        deploymentScope: 'Resource Group'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(resourceGroupName)'
        location: '$(location)'
        templateLocation: 'Linked artifact'
        csmFile: '$(templateFile)'
        csmParametersFile: '$(csmParametersFile)'
        overrideParameters: '-acrName $(acrName)'
        deploymentMode: 'Incremental'
        deploymentName: 'DeployPipelineTemplate'
        connectedServiceName: '${{ parameters.serviceConnection }}'
    
    - task: UseDotNet@2
      displayName: 'Use .NET SDK $(dotnetSdkVersion)'
      inputs:
        packageType: sdk
        version: '$(dotnetSdkVersion)'

    - task: Docker@2
      displayName: 'Build Docker image'
      inputs:
        command: build
        Dockerfile: './Dockerfile'
        tags: |
          $(Build.BuildId)
        repository: tailspin-spacegame-web
        buildContext: .
        arguments: '--pull'

    - script: |
        docker save tailspin-spacegame-web:$(Build.BuildId) -o $(Build.ArtifactStagingDirectory)/tailspin-spacegame-web-$(Build.BuildId).tar
      displayName: 'Save Docker image to artifact staging directory'

    - task: Docker@2
      displayName: 'Push Docker Image Artifact to ACR'
      inputs:
        containerRegistry: '$(acrName)'
        repository: 'tailspin-spacegame-web'
        tags: |
          $(Build.BuildId)