trigger:
- '*'

name: Deploy Bicep files

variables:
  namePrefix: 'spacewebgame'
  vmImageName: 'ubuntu-latest'

  system.debug: true

  buildConfiguration: 'Release'
  wwwrootDir: 'Tailspin.SpaceGame.Web/wwwroot'
  dotnetSdkVersion: '8.0.x'

  # Azure Resource Variables
  resourceGroupName: $(namePrefix)RG
  location: 'eastus'

  # Bicep files
  deploymentName: 'main_linux'
  templateFile: 'bicep/$(deploymentName).bicep'
  csmParametersFile: 'bicep/$(deploymentName).bicepparam'
  acrName: ''
  vmName: ''
  hostname: ''

pool:
  vmImage: $(vmImageName)

parameters:
- name: serviceConnection
  displayName: Azure Service Connection Name
  type: string
  default: azure-subscription-1

jobs:
- job: DeployBicep
  displayName: 'Deploy Bicep Template to Azure'  
  steps:
    - task: AzureResourceManagerTemplateDeployment@3
      displayName: 'Deploy Bicep Template'
      inputs:
        deploymentScope: 'Resource Group'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(resourceGroupName)'
        location: '$(location)'
        templateLocation: 'Linked artifact'
        csmFile: '$(templateFile)'
        csmParametersFile: '$(csmParametersFile)'
        overrideParameters: '-namePrefix $(namePrefix)'
        deploymentMode: 'Incremental'
        deploymentName: '$(deploymentName)'
        connectedServiceName: '${{ parameters.serviceConnection }}'
    
    - task: AzureCLI@2
      displayName: 'Get Outputs'
      inputs:
        azureSubscription: '${{ parameters.serviceConnection }}'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          vmNameOutput=$(az deployment group show --name $(deploymentName) --resource-group $(resourceGroupName) --query properties.outputs.vmName.value -o tsv)
          echo "##vso[task.setvariable variable=vmName]$vmNameOutput"
          echo "VM Name: $(vmName)"
          acrNameOutput=$(az deployment group show --name $(deploymentName) --resource-group $(resourceGroupName) --query properties.outputs.acrLoginServer.value -o tsv)
          echo "##vso[task.setvariable variable=acrName]$acrNameOutput"
          echo "ACR Name: $(acrName)"

- job: BuildAndPushDockerImage
  dependsOn: DeployBicep
  displayName: 'Build and Push Docker Image'
  steps:
    - task: UseDotNet@2
      displayName: 'Use .NET SDK $(dotnetSdkVersion)'
      inputs:
        packageType: sdk
        version: '$(dotnetSdkVersion)'

    - task: AzureCLI@2
      displayName: 'Login to ACR'
      inputs:
        azureSubscription: '${{ parameters.serviceConnection }}'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az acr login --name $(acrName)

    - task: Docker@2
      displayName: 'Build Docker image'
      inputs:
        containerRegistry: '$(acrName).azurecr.io'
        command: buildAndPush
        repository: 'tailspin-spacegame-web'
        Dockerfile: './Dockerfile'
        tags: |
          $(Build.BuildId)
        buildContext: .
        arguments: '--pull'
