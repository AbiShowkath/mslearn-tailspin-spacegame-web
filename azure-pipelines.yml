trigger:
- '*'

name: Deploy Bicep files

variables:
  vmImageName: 'ubuntu-latest'

  buildConfiguration: 'Release'
  wwwrootDir: 'Tailspin.SpaceGame.Web/wwwroot'
  dotnetSdkVersion: '8.0.x'

  # Azure Resource Variables
  resourceGroupName: 'SpaceGameResourceGroup'
  location: 'eastus'
  # adminUserName: 'abishowkathazurewebuser'
  # vmName: 'SpaceGameVM'
  # vmImage: 'Ubuntu2204'
  # vmSize: 'Standard_B1s'
  # vmDiskName: 'uploadDataDisk2'
  # vmDiskSize: '8'
  # vmsku: 'Premium_LRS'
  # storagesku: 'Standard_LRS'
  # containerName: 'spacegamecontainer'

  templateFile: 'bicep/main_linux.bicep'
  csmParametersFile: 'bicep/main_linux.bicepparam'
  acrName: 'spacegamewebacr2vmusczn7ciw2'
  vmName: 'spacegamewebVM'
  hostname: 'spacegamewebdns.eastus.cloudapp.azure.com'

pool:
  vmImage: $(vmImageName)

parameters:
- name: serviceConnection
  displayName: Azure Service Connection Name
  type: string
  default: azure-subscription-1

steps:
    - task: AzureResourceManagerTemplateDeployment@3
      name: deployBicep
      displayName: 'Deploy Bicep Template'
      inputs:
        deploymentScope: 'Resource Group'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(resourceGroupName)'
        location: '$(location)'
        templateLocation: 'Linked artifact'
        csmFile: '$(templateFile)'
        csmParametersFile: '$(csmParametersFile)'
        overrideParameters: '-acrName $(acrName)'
        deploymentMode: 'Incremental'
        deploymentName: 'deployPipelineTemplate'
        connectedServiceName: '${{ parameters.serviceConnection }}'
    
    # - task: AzureCLI@2
    #   displayName: 'Get Outputs'
    #   inputs:
    #     azureSubscription: '${{ parameters.serviceConnection }}'
    #     scriptType: 'bash'
    #     scriptLocation: 'inlineScript'
    #     inlineScript: |
    #       echo "##vso[task.setvariable variable=vmName]$(az deployment group show --resource-group $(resourceGroupName) --name deployPipelineTemplate --query properties.outputs.vmName.value -o tsv)"
    #       echo "##vso[task.setvariable variable=acrName]$(az deployment group show --resource-group $(resourceGroupName) --name deployPipelineTemplate --query properties.outputs.acrName.value -o tsv)"
    #       echo "VM Name: $(vmName)"
    #       echo "ACR Name: $(acrName)"

    - task: UseDotNet@2
      displayName: 'Use .NET SDK $(dotnetSdkVersion)'
      inputs:
        packageType: sdk
        version: '$(dotnetSdkVersion)'

    - task: Docker@2
      displayName: 'Build Docker image'
      inputs:
        command: buildAndPush
        containerRegistry: 'spacegameacr002'
        Dockerfile: './Dockerfile'
        tags: |
          $(Build.BuildId)
        repository: 'tailspin-spacegame-web'
        buildContext: .
        arguments: '--pull'
