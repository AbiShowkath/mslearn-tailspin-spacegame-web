trigger:
- '*'

name: Deploy Bicep files

variables:
  vmImageName: 'ubuntu-latest'

  # buildConfiguration: 'Release'
  # wwwrootDir: 'Tailspin.SpaceGame.Web/wwwroot'
  # dotnetSdkVersion: '8.0.x'

  # Azure Resource Variables
  resourceGroupName: 'SpaceGameResourceGroup'
  location: 'eastus'
  # adminUserName: 'abishowkathazurewebuser'
  # vmName: 'SpaceGameVM'
  # vmImage: 'Ubuntu2204'
  # vmSize: 'Standard_B1s'
  # vmDiskName: 'uploadDataDisk2'
  # vmDiskSize: '8'
  # vmsku: 'Premium_LRS'
  # storagesku: 'Standard_LRS'
  # containerName: 'spacegamecontainer'

  # azureServiceConnection: 'myServiceConnection'
  templateFile: 'storage.bicep'

pool:
  vmImage: $(vmImageName)

parameters:
- name: serviceConnection
  displayName: Azure Service Connection Name
  type: string
  default: azure-subscription-1

steps:
    - task: AzureCLI@2
      inputs:
          azureSubscription: '${{ parameters.serviceConnection }}'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            az --version
            az group create --name ${{ variables.resourceGroupName }} --location ${{ variables.location }}
            az deployment group create --resource-group ${{ variables.resourceGroupName }} --template-file ${{ variables.templateFile }}
