trigger:
- '*'

name: Deploy Bicep files

variables:
  namePrefix: 'spacewebgame'
  vmImageName: 'ubuntu-latest'

  # system.debug: true

  buildConfiguration: 'Release'
  wwwrootDir: 'Tailspin.SpaceGame.Web/wwwroot'
  dotnetSdkVersion: '8.0.x'

  # Azure Resource Variables
  resourceGroupName: $(namePrefix)RG
  location: 'eastus'
  # adminUserName: 'abishowkathazurewebuser'
  # vmName: 'SpaceGameVM'
  # vmImage: 'Ubuntu2204'
  # vmSize: 'Standard_B1s'
  # vmDiskName: 'uploadDataDisk2'
  # vmDiskSize: '8'
  # vmsku: 'Premium_LRS'
  # storagesku: 'Standard_LRS'
  # containerName: 'spacegamecontainer'

  # Bicep files
  deploymentName: 'main_linux'
  templateFile: 'bicep/$(deploymentName).bicep'
  csmParametersFile: 'bicep/$(deploymentName).bicepparam'
  acrName: ''
  vmName: ''
  hostname: ''

pool:
  vmImage: $(vmImageName)

parameters:
- name: serviceConnection
  displayName: Azure Service Connection Name
  type: string
  default: azure-subscription-1

steps:
    - task: AzureResourceManagerTemplateDeployment@3
      displayName: 'Deploy Bicep Template'
      inputs:
        deploymentScope: 'Resource Group'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(resourceGroupName)'
        location: '$(location)'
        templateLocation: 'Linked artifact'
        csmFile: '$(templateFile)'
        csmParametersFile: '$(csmParametersFile)'
        overrideParameters: '-namePrefix $(namePrefix)'
        deploymentMode: 'Incremental'
        deploymentName: '$(deploymentName)'
        connectedServiceName: '${{ parameters.serviceConnection }}'
    
    - task: AzureCLI@2
      displayName: 'Get Outputs'
      inputs:
        azureSubscription: '${{ parameters.serviceConnection }}'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az deployment group show --name $(deploymentName) --resource-group $(resourceGroupName) --query properties.outputs
          vmNameOutput=$(az deployment group show --name $(deploymentName) --resource-group $(resourceGroupName) --query properties.outputs.vmName.value -o tsv)
          echo "##vso[task.setvariable variable=vmName]$vmNameOutput"
          echo "VM Name: $vmNameOutput"
          acrNameOutput=$(az deployment group show --name $(deploymentName) --resource-group $(resourceGroupName) --query properties.outputs.acrName.value -o tsv)
          echo "##vso[task.setvariable variable=acrName]$acrNameOutput"
          echo "ACR Name: $acrNameOutput"

