trigger:
- '*'

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: 'Release'
  wwwrootDir: 'Tailspin.SpaceGame.Web/wwwroot'
  dotnetSdkVersion: '8.0.x'

  # Azure Resource Variables
  resourceGroupName: 'SpaceGameResourceGroup'
  location: 'eastus'
  adminUserName: 'abishowkathazurewebuser'
  vmName: 'SpaceGameVM'
  vmImage: 'Ubuntu2204'
  vmSize: 'Standard_B1s'
  vmDiskName: 'uploadDataDisk2'
  vmDiskSize: '8'
  vmsku: 'Premium_LRS'
  # storange name with randomly generated number suffixed, must be globally unique
  storageAccount: 'spacegamestorage$RANDOM'
  storagesku: 'Standard_LRS'
  containerName: 'spacegamecontainer'

parameters:
- name: serviceConnection
  displayName: Azure Service Connection Name
  type: string
  default: azure-subscription-1

steps:
- task: UseDotNet@2
  displayName: 'Use .NET SDK $(dotnetSdkVersion)'
  inputs:
    packageType: sdk
    version: '$(dotnetSdkVersion)'

- task: Docker@2
  displayName: 'Build Docker image'
  inputs:
    command: build
    Dockerfile: './Dockerfile'
    tags: |
      $(Build.BuildId)
    repository: tailspin-spacegame-web
    buildContext: .
    arguments: '--pull'

- script: |
    docker save tailspin-spacegame-web:$(Build.BuildId) -o $(Build.ArtifactStagingDirectory)/tailspin-spacegame-web-$(Build.BuildId).tar
  displayName: 'Save Docker image to artifact staging directory'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Docker Image Artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'

- task: AzureCLI@2
  displayName: 'Setup Azure Resources'
  inputs:
    azureSubscription: '${{ parameters.serviceConnection }}'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Setting up Azure resources..."
      az group create --name ${{ variables.resourceGroupName }} --location ${{ variables.location }}
      az vm create --resource-group ${{ variables.resourceGroupName }} --location ${{ variables.location }} --admin-username ${{ variables.adminUserName }} --name ${{ variables.vmName }} --image ${{ variables.vmImage }} --generate-ssh-keys --verbose --size ${{ variables.vmSize }}
      
      echo "Creating storage account and container..."
      az storage account create --name ${{ variables.storageAccount }} --resource-group ${{ variables.resourceGroupName }} --location ${{ variables.location }} --sku ${{ variables.storagesku }}

      CONNECTION=$(az storage account show-connection-string --name ${{ variables.storageAccount }} --resource-group ${{ variables.resourceGroupName }} --query connectionString -o tsv)
      
      echo "Creating storage container..."
      az storage container create --name ${{ variables.containerName }} --connection-string $CONNECTION

      az storage blob upload --container-name ${{ variables.containerName }} --file $(Build.ArtifactStagingDirectory)/tailspin-spacegame-web-$(Build.BuildId).tar --name tailspin-spacegame-web-$(Build.BuildId).tar --connection-string $CONNECTION
