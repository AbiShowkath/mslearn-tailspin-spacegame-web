trigger:
- '*'

name: Deploy Bicep files

variables:
  vmImageName: 'ubuntu-latest'

  # buildConfiguration: 'Release'
  # wwwrootDir: 'Tailspin.SpaceGame.Web/wwwroot'
  # dotnetSdkVersion: '8.0.x'

  # Azure Resource Variables
  resourceGroupName: 'SpaceGameResourceGroup'
  location: 'eastus'
  # adminUserName: 'abishowkathazurewebuser'
  # vmName: 'SpaceGameVM'
  # vmImage: 'Ubuntu2204'
  # vmSize: 'Standard_B1s'
  # vmDiskName: 'uploadDataDisk2'
  # vmDiskSize: '8'
  # vmsku: 'Premium_LRS'
  # storagesku: 'Standard_LRS'
  # containerName: 'spacegamecontainer'

  # azureServiceConnection: 'myServiceConnection'
  templateFile: 'bicep/main.bicep'
  csmParametersFile: 'bicep/main.bicepparam'

pool:
  vmImage: $(vmImageName)

parameters:
- name: serviceConnection
  displayName: Azure Service Connection Name
  type: string
  default: azure-subscription-1

steps:
    - task: AzureResourceManagerTemplateDeployment@3
      inputs:
        deploymentScope: 'Resource Group'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(resourceGroupName)'
        location: '$(location)'
        templateLocation: 'Linked artifact'
        csmFile: '$(templateFile)'
        csmParametersFile: '$(csmParametersFile)'
        overrideParameters: '-storageAccountType Standard_LRS'
        deploymentMode: 'Incremental'
        deploymentName: 'DeployPipelineTemplate'
        connectedServiceName: '${{ parameters.serviceConnection }}'

