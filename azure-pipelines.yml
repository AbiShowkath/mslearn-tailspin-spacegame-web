trigger:
- '*'

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: 'Release'
  wwwrootDir: 'Tailspin.SpaceGame.Web/wwwroot'
  dotnetSdkVersion: '8.0.x'

  # Azure Resource Variables
  resourceGroupName: 'SpaceGameResourceGroup'
  location: 'eastus'
  adminUserName: 'abishowkathazurewebuser'
  vmName: 'SpaceGameVM'
  vmImage: 'Ubuntu2204'
  vmSize: 'Standard_B1s'
  vmDiskName: 'uploadDataDisk2'
  vmDiskSize: '8'
  vmsku: 'Premium_LRS'
  # storange name with randomly generated number suffixed, must be globally unique
  storageAccount: 'spacegamestorage$RANDOM'
  storagesku: 'Standard_LRS'
  containerName: 'spacegamecontainer'

parameters:
- name: serviceConnection
  displayName: Azure Service Connection Name
  type: string
  default: azure-subscription-1

steps:
- task: UseDotNet@2
  displayName: 'Use .NET SDK $(dotnetSdkVersion)'
  inputs:
    packageType: sdk
    version: '$(dotnetSdkVersion)'

- task: Docker@2
  displayName: 'Build Docker image'
  inputs:
    command: build
    Dockerfile: './Dockerfile'
    tags: |
      $(Build.BuildId)
    repository: tailspin-spacegame-web
    buildContext: .
    arguments: '--pull'

- script: |
    docker save tailspin-spacegame-web:$(Build.BuildId) -o $(Build.ArtifactStagingDirectory)/tailspin-spacegame-web-$(Build.BuildId).tar
  displayName: 'Save Docker image to artifact staging directory'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Docker Image Artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'

- task: AzureCLI@2
  displayName: 'Setup Azure Resources'
  inputs:
    azureSubscription: '${{ parameters.serviceConnection }}'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az group create --name ${{ variables.resourceGroupName }} --location ${{ variables.location }}
      az vm create --resource-group ${{ variables.resourceGroupName }} --location ${{ variables.location }} --admin-username ${{ variables.adminUserName }} --name ${{ variables.vmName }} --image ${{ variables.vmImage }} --generate-ssh-keys --verbose --size ${{ variables.vmSize }}
      az vm disk attach --resource-group ${{ variables.resourceGroupName }} --vm-name ${{ variables.vmName }} --name ${{ variables.vmDiskName }} --size-gb ${{ variables.vmDiskSize }} --sku ${{ variables.vmsku }} --new
      az storage account create --name ${{ variables.storageAccount }} --resource-group ${{ variables.resourceGroupName }} --location ${{ variables.location }} --sku ${{ variables.storagesku }}
      az storage container create --name ${{ variables.containerName }} --account-name ${{ variables.storageAccount }} --public-access blob

      storageKey=$(az storage account keys list --resource-group ${{ variables.resourceGroupName }} --account-name ${{ variables.storageAccount }} --query "[0].value" -o tsv)
      az storage blob upload --account-name ${{ variables.storageAccount }} --account-key $storageKey --container-name ${{ variables.containerName }} --name tailspin-spacegame-web.tar --file $(Build.ArtifactStagingDirectory)/tailspin-spacegame-web-$(Build.BuildId).tar

- task: AzureCLI@2
  displayName: 'Install Docker on VM, Download Blob Image, and Run Container'
  inputs:
    azureSubscription: '${{ parameters.serviceConnection }}'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      ipaddress=$(az vm show --name ${{ variables.vmName }} --resource-group ${{ variables.resourceGroupName }} --show-details --query "publicIps" -o tsv)

      ssh ${{ variables.adminUserName }}@$ipaddress << 'EOF'
        sudo apt-get update
        sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y docker-ce docker-ce-cli containerd.io
        sudo systemctl start docker
        sudo systemctl enable docker

        export AZURE_STORAGE_ACCOUNT=${{ variables.storageAccount }}
        export AZURE_STORAGE_KEY=$storageKey
        azcopy copy "https://$AZURE_STORAGE_ACCOUNT.blob.core.windows.net/${{ variables.containerName }}/tailspin-spacegame-web.tar" ./tailspin-spacegame-web.tar
        sudo docker load < tailspin-spacegame-web.tar
        sudo docker run -d -p 80:80 tailspin-spacegame-web:$(Build.BuildId)
      EOF

      echo "Application is accessible at http://$ipaddress"

