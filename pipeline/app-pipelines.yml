trigger:
- 'app-pipeline-setup'

name: Build and Push Docker Image

variables:
  namePrefix: 'spacewebgame'
  vmImageName: 'ubuntu-latest'

  system.debug: true

  buildConfiguration: 'Release'
  wwwrootDir: 'Tailspin.SpaceGame.Web/wwwroot'
  dotnetSdkVersion: '8.0.x'

  # Azure Resource Variables
  resourceGroupName: $(namePrefix)RG
  location: 'eastus'

  # Bicep files
  deploymentName: 'main_linux'
  templateFile: 'bicep/$(deploymentName).bicep'
  csmParametersFile: 'bicep/$(deploymentName).bicepparam'
  acrName: ''
  vmName: ''
  hostname: ''
  repositoryName: 'tailspin-spacegame-web'

pool:
  vmImage: $(vmImageName)

parameters:
- name: serviceConnection
  displayName: Azure Service Connection Name
  type: string
  default: azure-subscription-1

jobs:
- job: BuildAndPushDockerImage
  dependsOn: DeployBicep
  displayName: 'Build and Push Docker Image'
  steps:
    - task: UseDotNet@2
      displayName: 'Use .NET SDK $(dotnetSdkVersion)'
      inputs:
        packageType: sdk
        version: '$(dotnetSdkVersion)'

    - task: AzureCLI@2
      displayName: 'Login to ACR'
      inputs:
        azureSubscription: '${{ parameters.serviceConnection }}'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az acr login --name $(acrName)

    - task: Docker@2
      displayName: 'Build Docker image'
      inputs:
        containerRegistry: '$(acrName).azurecr.io/$(repositoryName)'
        command: buildAndPush
        repository: '$(repositoryName)'
        Dockerfile: './Dockerfile'
        tags: |
          $(Build.BuildId)
        buildContext: .
        arguments: '--pull'
