trigger:
  branches:
    include:
      - 'multistage-env-pipeline-bicep-setup'

name: 'multi-stage-bicep-pipeline'

variables:
  buildConfiguration: 'Release'
  releaseBranchName: 'release'
  vmImageName: 'ubuntu-latest'
  namePrefix: 'spacegame'
  resourceGroupName: $(namePrefix)RG
  location: 'southindia'
  deploymentName: 'main'
  templateFile: 'pipeline/bicep/$(deploymentName).bicep'
  csmParametersFile: 'pipeline/bicep/$(deploymentName).bicepparam'

parameters:
- name: serviceConnection
  displayName: Azure Service Connection Name
  type: string
  default: azure-subscription-1

stages:
- stage: 'Infrastructure'
  displayName: 'Deploy Infrastructure via Bicep'
  jobs:
  - job: 'DeployBicep'
    displayName: 'Deploy Bicep Template to Azure'  
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureResourceManagerTemplateDeployment@3
      displayName: 'Deploy Bicep Template'
      inputs:
        deploymentScope: 'Resource Group'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(resourceGroupName)'
        location: '$(location)'
        templateLocation: 'Linked artifact'
        csmFile: '$(templateFile)'
        csmParametersFile: '$(csmParametersFile)'
        overrideParameters: '-namePrefix $(namePrefix)'
        deploymentMode: 'Incremental'
        deploymentName: '$(deploymentName)'
        connectedServiceName: '${{ parameters.serviceConnection }}'

    - task: AzureCLI@2
      displayName: 'Get ACR name'
      name: GetACRName
      inputs:
        azureSubscription: '${{ parameters.serviceConnection }}'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          acrNameOutput=$(az deployment group show --name $(deploymentName) --resource-group $(resourceGroupName) --query properties.outputs.acrName.value -o tsv)
          echo "##vso[task.setvariable variable=acrName;isOutput=true]$acrNameOutput"

