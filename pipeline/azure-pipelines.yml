trigger:
  branches:
    include:
      - 'multistage-env-pipeline-bicep-setup'

name: 'multi-stage-bicep-pipeline'

variables:
  buildConfiguration: 'Release'
  releaseBranchName: 'release'
  vmImageName: 'ubuntu-latest'
  namePrefix: 'spacegame'
  resourceGroupName: $(namePrefix)RG
  location: 'eastus'

  # Bicep files
  deploymentName: 'main'
  templateFile: 'pipeline/bicep/$(deploymentName).bicep'
  csmParametersFile: 'pipeline/bicep/$(deploymentName).bicepparam'

  # These will be populated after deployment
  repositoryName: 'tailspin-spacegame-web'

parameters:
- name: serviceConnection
  displayName: Azure Service Connection Name
  type: string
  default: azure-subscription-1

stages:
- stage: 'Infrastructure'
  displayName: 'Deploy Infrastructure via Bicep'
  jobs:
  - job: 'DeployBicep'
    displayName: 'Deploy Bicep Template to Azure'  
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureResourceManagerTemplateDeployment@3
      displayName: 'Deploy Bicep Template'
      inputs:
        deploymentScope: 'Resource Group'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(resourceGroupName)'
        location: '$(location)'
        templateLocation: 'Linked artifact'
        csmFile: '$(templateFile)'
        csmParametersFile: '$(csmParametersFile)'
        overrideParameters: '-namePrefix $(namePrefix)'
        deploymentMode: 'Incremental'
        deploymentName: '$(deploymentName)'
        connectedServiceName: '${{ parameters.serviceConnection }}'

    - task: AzureCLI@2
      displayName: 'Get Outputs'
      name: GetOutputs
      inputs:
        azureSubscription: '${{ parameters.serviceConnection }}'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          webAppDevNameOutput=$(az deployment group show --name $(deploymentName) --resource-group $(resourceGroupName) --query properties.outputs.webAppDevName.value -o tsv)
          echo "Web App Dev Name: $webAppDevNameOutput"
          echo "##vso[task.setvariable variable=webAppDevName;isOutput=true]$webAppDevNameOutput"
          webAppStageNameOutput=$(az deployment group show --name $(deploymentName) --resource-group $(resourceGroupName) --query properties.outputs.webAppStageName.value -o tsv)
          echo "Web App Stage Name: $webAppStageNameOutput"
          echo "##vso[task.setvariable variable=webAppStageName;isOutput=true]$webAppStageNameOutput"
          acrNameOutput=$(az deployment group show --name $(deploymentName) --resource-group $(resourceGroupName) --query properties.outputs.acrName.value -o tsv)
          echo "ACR Name: $acrNameOutput"
          echo "##vso[task.setvariable variable=acrName;isOutput=true]$acrNameOutput"

- stage: Build
  displayName: 'Build and Push Docker Image'
  dependsOn: Infrastructure
  condition: succeeded()
  variables:
    acrName: $[stageDependencies.Infrastructure.DeployBicep.outputs['GetOutputs.acrName']]
  jobs:
  - job: BuildAndPushDockerImage
    displayName: 'Build and Push Docker Image'
    pool:
      vmImage: $(vmImageName)
    steps:
      - task: UseDotNet@2
        displayName: 'Use .NET SDK 8.0.x'
        inputs:
          packageType: sdk
          version: '8.0.x'

      - task: Docker@2
        displayName: 'Build Docker image'
        inputs:
          command: 'build'
          Dockerfile: './Dockerfile'
          repository: '$(repositoryName)'
          tags: |
            $(Build.BuildId)

      - task: AzureCLI@2
        displayName: 'Login to ACR'
        inputs:
          azureSubscription: '${{ parameters.serviceConnection }}'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            acrLoginServer=$(acrName).azurecr.io
            echo "Logging into ACR: $acrLoginServer"
            az acr login -n $acrLoginServer
            docker tag $(repositoryName):$(Build.BuildId) $acrLoginServer/$(repositoryName):latest
            docker push $acrLoginServer/$(repositoryName):latest

- stage: 'Dev'
  displayName: 'Deploy to the dev environment'
  dependsOn: 
    - Infrastructure
    - Build
  condition:  succeeded()
  variables:
    webAppDevName: $[stageDependencies.Infrastructure.DeployBicep.outputs['GetOutputs.webAppDevName']]
    acrName: $[stageDependencies.Infrastructure.DeployBicep.outputs['GetOutputs.acrName']]
  jobs:
  - deployment: Deploy
    pool:
      vmImage: $(vmImageName)
    environment: dev
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureRmWebAppDeployment@4
            displayName: 'Azure App Service Deploy: dev website'
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: ${{ parameters.serviceConnection }}
              appType: 'webAppContainer'
              WebAppName: '$(webAppDevName)'
              DockerNamespace: '$(acrName).azurecr.io'
              DockerRepository: '$(repositoryName):latest'

