trigger:
  branches:
    include:
      - 'new-pipeline-setup-1'

name: 'azure-pipeline'

variables:
  environment: 'dev'

  namePrefix: 'spacegame'
  vmImageName: 'ubuntu-latest'

  system.debug: true

  buildConfiguration: 'Release'

  # Azure Resource Variables
  resourceGroupName: $(namePrefix)RG
  location: 'eastus'

  # Bicep files
  acrDeploymentName: '$(namePrefix)_acr'
  acrTemplateFile: 'pipeline/bicep/$(acrDeploymentName).bicep'
  acrCsmParametersFile: 'pipeline/bicep/$(acrDeploymentName).bicepparam'

  acIDeploymentName: '$(namePrefix)_aci'
  acITemplateFile: 'pipeline/bicep/$(acIDeploymentName).bicep'
  acICsmParametersFile: 'pipeline/bicep/$(acIDeploymentName).bicepparam'

  # These will be populated after deployment
  repositoryName: 'tailspin-spacegame-web'

parameters:
- name: serviceConnection
  displayName: Azure Service Connection Name
  type: string
  default: azure-subscription-1

stages:
- stage: Create_Update_ACR
  displayName: 'Create or Update ACR via Bicep'
  jobs:
  - job: DeployACRBicep
    displayName: 'Deploy ACR Bicep Template to Azure'  
    pool:
      vmImage: $(vmImageName)
    steps:
      - task: AzureResourceManagerTemplateDeployment@3
        displayName: 'Deploy ACR Bicep Template'
        inputs:
          deploymentScope: 'Resource Group'
          action: 'Create Or Update Resource Group'
          resourceGroupName: '$(resourceGroupName)'
          location: '$(location)'
          templateLocation: 'Linked artifact'
          csmFile: '$(acRTemplateFile)'
          csmParametersFile: '$(acRCsmParametersFile)'
          deploymentMode: 'Incremental'
          deploymentName: '$(acRDeploymentName)'
          connectedServiceName: '${{ parameters.serviceConnection }}'
      
      - task: AzureCLI@2
        displayName: 'Get Outputs'
        name: GetACROutputs
        inputs:
          azureSubscription: '${{ parameters.serviceConnection }}'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            acrNameOutput=$(az deployment group show --name $(acRDeploymentName) --resource-group $(resourceGroupName) --query properties.outputs.acrLoginServer.value -o tsv)
            echo "Stage 1 ACR Output Name: $acrNameOutput"
            echo "##vso[task.setvariable variable=acrName;isOutput=true]$acrNameOutput"
      - bash: |
          echo "Stage 1 ACR Name: $(GetACROutputs.acrName)"

- stage: Build_and_Push_Docker_Image
  displayName: 'Build and Push Docker Image'
  dependsOn: Create_Update_ACR
  jobs:
  - job: BuildAndPushDockerImage
    displayName: 'Build and Push Docker Image'
    pool:
      vmImage: $(vmImageName)
    variables:
      acrName: $[stageDependencies.DeployACRBicep.outputs['DeployACRBicep.GetACROutputs.acrName']]
    steps:
      - bash: |
          echo "Stage 1 Stage dependencies: $[stageDependencies]"
          echo "Stage 1 DeployACRBicep: $[stageDependencies.Create_Update_ACR]"
          echo "Stage 1 Outputs: $[stageDependencies.Create_Update_ACR.DeployACRBicep.outputs]"
          echo "Stage 1 ACR Name: $[stageDependencies.Create_Update_ACR.DeployACRBicep.outputs['GetACROutputs.acrName']]"

          echo "Stage 1 dependencies: $[dependencies]"
          echo "Stage 1 DeployACRBicep: $[dependencies.Create_Update_ACR]"
          echo "Stage 1 Outputs: $[dependencies.Create_Update_ACR.outputs]"
          echo "Stage 1 ACR Name: $[dependencies.Create_Update_ACR.outputs['DeployACRBicep.GetACROutputs.acrName']]"

          echo "Stage 2 ACR Name: $(acrName)"

      - task: UseDotNet@2
        displayName: 'Use .NET SDK 8.0.x'
        inputs:
          packageType: sdk
          version: '8.0.x'

      - task: Docker@2
        displayName: 'Build Docker image'
        inputs:
          command: 'build'
          Dockerfile: './Dockerfile'
          repository: '$(repositoryName)'
          tags: $(acrName)/$(Build.BuildId)

      - bash: |
          echo "Stage 2 Build id: $(Build.BuildId)"
          echo "Stage 2 Build uri: $(Build.BuildUri)"
          echo "Stage 2 Build number: $(Build.BuildNumber)"

      - task: AzureCLI@2
        displayName: 'Login to ACR'
        inputs:
          azureSubscription: '${{ parameters.serviceConnection }}'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            echo "Stage 2 ACR Name: $(acrName)"
            az acr login -n $(acrName)
            docker push $(acrName)/$(Build.BuildName)

- stage: Create_Update_ACI
  displayName: 'Create or Update and Start ACI via Bicep'
  dependsOn: Build_and_Push_Docker_Image
  jobs:
  - job: DeployACIBicep
    displayName: 'Deploy ACI Bicep Template to Azure'
    pool:
      vmImage: $(vmImageName)
    steps:
      - task: AzureResourceManagerTemplateDeployment@3
        displayName: 'Deploy ACI Bicep Template'
        inputs:
          deploymentScope: 'Resource Group'
          action: 'Create Or Update Resource Group'
          resourceGroupName: '$(resourceGroupName)'
          location: '$(location)'
          templateLocation: 'Linked artifact'
          csmFile: '$(aciTemplateFile)'
          csmParametersFile: '$(aciCsmParametersFile)'
          deploymentMode: 'Incremental'
          deploymentName: '$(aciDeploymentName)'
          connectedServiceName: '${{ parameters.serviceConnection }}'